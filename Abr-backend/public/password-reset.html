<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | KaamGhar</title>
  <style>
    body { margin: 0; padding: 24px; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; background: #f2f1e9; color: #243d32; font: 16px/1.5 system-ui, sans-serif; }
    main { box-sizing: border-box; width: min(100%, 440px); padding: clamp(20px, 5vw, 36px); background: #fffdf8; border: 1px solid #e1e4dc; border-radius: 12px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    form { margin: 24px 0 16px; }
    label { display: block; margin: 12px 0; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: 5px; padding: 10px; border: 1px solid #aab7ad; border-radius: 6px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #246348; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; }
    a { color: #246348; }
    [data-error] { color: #9b352a; }
  </style>
  <script src="/api/auth/password-reset.js" defer></script>
</head>
<body>
  <main>
    <h1 id="reset-title">Forgot password?</h1>
    <p id="reset-intro">Enter the email address you use for your KaamGhar account.</p>
    <form id="request-form" hidden>
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <button type="submit">Email me a reset link</button>
    </form>
    <form id="reset-form" hidden>
      <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <label>Confirm new password<input name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <button type="submit">Set new password</button>
    </form>
    <p id="reset-message" role="status"></p>
    <p id="request-again" hidden><a href="/api/auth/password-reset">Request a new link</a></p>
    <a id="sign-in-link" href="/login">Back to sign in</a>
  </main>
</body>
</html>
